[package]
name = "veloread"
version = "0.1.0"
description = "EPUB reader with a speed-reading pacer"
authors = ["fangwang"]
license = "MIT"
repository = "https://github.com/fangwangme/VeloRead"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "veloread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
base64 = "0.22"
# `bundled` compiles SQLite in, so the app never depends on the host's copy.
rusqlite = { version = "0.37", features = ["bundled"] }
